AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "*.gemspec"

Naming/PredicatePrefix:
  Enabled: false

# Data tables, not code that grows by logic: the mutation manifest (one entry per mutant), and
# the server-message wording and validator listing, each a rule-by-rule mapping.
Metrics:
  Exclude:
    - "spec/mutation/manifest.rb"
    - "lib/langsys/rails/messages.rb"
    - "lib/langsys/rails/validator_source.rb"

Layout/LineLength:
  Max: 120
  Exclude:
    - "spec/mutation/manifest.rb"

# These specs pass Rails' own %{name} placeholders, which is what they test.
Style/FormatStringToken:
  Exclude:
    - "spec/i18n_bridge_spec.rb"
    - "spec/messages_spec.rb"

# The gem entry point is intentionally dash-named (matches the gem name for auto-require).
Naming/FileName:
  Exclude:
    - "lib/langsys-rails.rb"

# `::Rails` is required, not redundant: inside the `Langsys::Rails` namespace a bare `Rails`
# would resolve to this module, not the framework.
Style/RedundantConstantBase:
  Enabled: false
